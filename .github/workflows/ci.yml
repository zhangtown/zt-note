name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go（vet + 单测）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      # internal/webui/dist 只有占位文件（构建产物不入库），embed 依旧能编译：
      # 缺 index.html 时 webui.Available() 为 false，服务端会提示“前端未构建”。
      - run: go vet ./...
      - run: go test ./... -count=1

  ui:
    name: 前端（类型检查 + build + 逻辑测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # build 里含 tsc --noEmit，postbuild 跑 check-build.mjs
      # （校验产物结构，并防止 vite 把静态资源输出回网关保留的 assets/ 前缀）
      - run: npm run build
        working-directory: ui
      - run: npm run test:logic
        working-directory: ui
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: internal/webui/dist
          retention-days: 7

  fpk:
    name: fnOS 安装包（build.sh all → zt-note.fpk）
    runs-on: ubuntu-latest
    needs: [go, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: 下载 fnpack（Linux）
        run: |
          mkdir -p .toolchain/fnpack
          curl -fsSL -o .toolchain/fnpack/fnpack \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod +x .toolchain/fnpack/fnpack
          .toolchain/fnpack/fnpack --version || true
      - run: npm ci
        working-directory: ui
      # 打包 linux/amd64 二进制（前端 go:embed 进包内）
      - run: bash build.sh all
      - name: 校验产物
        run: |
          ls -la deploy/fnos-app/zt-note.fpk
          test -s deploy/fnos-app/zt-note.fpk
      - uses: actions/upload-artifact@v4
        with:
          name: zt-note-fpk
          path: deploy/fnos-app/zt-note.fpk
          retention-days: 30
